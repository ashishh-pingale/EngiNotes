<!-- Dashboard Header -->
<header class="dashboard-header">
    <div>
        <h1>Welcome Admin</h1>
        <p>Manage engineering notes uploaded by students.</p>
    </div>

    <input
        type="text"
        id="searchInput"
        placeholder="Search title, subject or uploader..."
    >
</header>

<!-- Dashboard Cards -->
<section class="cards">

    <div class="card">
        <h3>Pending</h3>
        <span id="pendingCount">0</span>
    </div>

    <div class="card">
        <h3>Approved</h3>
        <span id="approvedCount">0</span>
    </div>

    <div class="card">
        <h3>Rejected</h3>
        <span id="rejectedCount">0</span>
    </div>

    <div class="card">
        <h3>Total Downloads</h3>
        <span id="downloadsCount">0</span>
    </div>

</section>

<!-- Pending Notes Panel -->
<section class="panel">

    <div class="toolbar">

        <select id="branchFilter">
            <option value="">Branch</option>
        </select>

        <select id="yearFilter">
            <option value="">Year</option>
        </select>

        <select id="semesterFilter">
            <option value="">Semester</option>
        </select>

        <select id="subjectFilter">
            <option value="">Subject</option>
        </select>

        <select id="sortFilter">
            <option value="latest">Latest</option>
            <option value="oldest">Oldest</option>
        </select>

    </div>

    <table>

        <thead>

            <tr>
                <th>PDF</th>
                <th>Title</th>
                <th>Subject</th>
                <th>Branch</th>
                <th>Year</th>
                <th>Semester</th>
                <th>Uploader</th>
                <th>Upload Date</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody id="pendingNotesBody">
            <!-- Loaded dynamically -->
        </tbody>

    </table>

    <div id="emptyState" class="empty-state">

        <p>No pending uploads found.</p>

    </div>

</section>
