<!-- Include Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<div class="modal-overlay" id="successModal" aria-hidden="true">
  <div class="modal">
    <button class="modal-close" id="modalClose"><i data-lucide="x"></i></button>

    <div class="modal-icon">
      <i data-lucide="badge-check" size="46"></i>
    </div>

    <h2 class="modal-title" id="modalTitle">🎉 Note Submitted Successfully!</h2>

    <p class="modal-message" id="modalMessage">
      Your note has been submitted successfully and is now pending admin review.
      It will become visible to other students once approved.
    </p>

    <div class="modal-actions">
      <button class="modal-btn primary" id="uploadAnotherBtn">
        <i data-lucide="upload-cloud" size="18"></i>
        Upload Another
      </button>

      <button class="modal-btn secondary" id="browseNotesBtn">
        Browse Notes
      </button>
    </div>
  </div>
</div>
