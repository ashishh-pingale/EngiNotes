<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EngiNotes</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">Engi<span>Notes</span></div>
            
            <h2>Welcome Back</h2>
            <p class="subtitle">Enter your credentials to access your notes</p>

            <div id="error-box" class="error-msg">
                Invalid email or password. Please try again.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="name@college.edu" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <span id="togglePassword" class="toggle-btn">Show</span>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <p class="signup-text">
                Don't have an account? <a href="/main/sign-up.html">Sign up</a>
            </p>
        </div>
        
        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <script type="module" src="login.js"></script>

</body>
</html>
