<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | EngiNotes</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/nav-bar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            Engi<span>Notes</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="/main/index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="/main/browse.html">
                    Explore Notes
                </a>
            </li>

            <li>
                <a href="/main/contact.html">
                    Contact Us
                </a>
            </li>

            <li>
                <a href="/main/discover.html">
                    Discover
                </a>
            </li>

            <li>
                <a href="/main/about.html">
                    About Us
                </a>
            </li>

            <li>
                <a href="/main/chat.html" class="active">
                    Chat
                </a>
            </li>

            <li>
                <a href="/main/upload.html">
                    Upload
                </a>
            </li>

            <li id="adminLink" class="hidden">
                <a href="/admin/html/admin.html">
                    Admin
                </a>
            </li>

        </ul>


        <!-- ================= NAV AUTH ================= -->

        <div class="nav-auth">

            <!-- Notification -->

            <div class="notification-wrapper">

                <button class="notification-btn" id="notificationBtn" aria-label="Notifications">

                    🔔

                    <span class="notification-badge hidden" id="notificationBadge">
                        0
                    </span>

                </button>


                <div class="notification-dropdown" id="notificationDropdown">

                    <div class="notification-header">

                        <h3>
                            Notifications
                        </h3>

                    </div>


                    <div class="notification-list" id="notificationList">

                        <p class="notification-empty">
                            No notifications yet.
                        </p>

                    </div>

                </div>

            </div>


            <!-- Auth controls -->

            <div id="authSection">

                <span class="auth-loading">
                    ...
                </span>

                <button class="btn-secondary">
                    Sign In
                </button>

                <button class="btn-primary">
                    Sign Up
                </button>

            </div>

        </div>

    </nav>


    <!-- ================= CHAT APP ================= -->

    <div class="app-container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <h1>
                    Chats
                </h1>

                <input type="text" placeholder="Search messages..." class="search-bar">

            </div>


            <div class="contact-list">

                <!-- Contacts loaded dynamically -->

            </div>

        </aside>


        <!-- CHAT AREA -->

        <main class="chat-area">
            <div class="chat-empty-state" id="chatEmptyState">

                <div class="chat-empty-icon">
                    💬
                </div>

                <h2>
                    Start a conversation
                </h2>

                <p>
                    Select someone from your connections to start chatting.
                </p>

                <span>
                    Your conversations will appear here.
                </span>

            </div>

            <header class="chat-header">

                <button id="backToChatsBtn" class="back-to-chats-btn" type="button">

                    ←

                </button>


                <div class="user-profile">

                    <div class="avatar blue-gradient">
                        AR
                    </div>

                    <div class="user-status">

                        <span class="username">
                            Chat
                        </span>

                        <span class="status-indicator online">
                            Online
                        </span>

                    </div>

                </div>


            </header>


            <!-- MESSAGES -->

            <div class="message-history" id="messages">

                <!-- Messages generated by JS -->

            </div>


            <!-- INPUT -->

            <footer class="chat-input-area">

                <div class="input-container">

                    <button class="attach-btn" type="button">
                        +
                    </button>


                    <input type="text" id="messageInput" placeholder="Type a message...">


                    <button class="send-btn" id="sendBtn" type="button">
                        Send
                    </button>

                </div>

            </footer>

        </main>

    </div>


    <!-- ================= SCRIPTS ================= -->

    <script type="module" src="/js/chat.js"></script>
    <script type="module" src="../js/auth-state.js"></script>

</body>

</html>
