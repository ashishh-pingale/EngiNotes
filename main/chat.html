<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | EngiNotes</title>
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/nav-bar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">

        <!-- 🔹 SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Chats</h1>
                <input type="text" placeholder="Search messages..." class="search-bar">
            </div>
            
            <div class="contact-list">
                <!-- STATIC FOR NOW -->
                <div class="contact active">
                    <div class="avatar blue-gradient">AR</div>
                    <div class="contact-info">
                        <div class="contact-name">
                            Alex Rivera <span class="time">Now</span>
                        </div>
                        <p class="last-msg">Click to start chatting</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 🔹 CHAT AREA -->
        <main class="chat-area">

            <!-- HEADER -->
            <header class="chat-header">
                <div class="user-profile">
                    <div class="avatar blue-gradient">AR</div>
                    <div class="user-status">
                        <span class="username">Chat</span>
                        <span class="status-indicator online">Online</span>
                    </div>
                </div>
            </header>

            <!-- 🔥 MESSAGES (DYNAMIC) -->
            <div class="message-history" id="messages">
                <!-- Messages will come here dynamically -->
            </div>

            <!-- 🔥 INPUT -->
            <footer class="chat-input-area">
                <div class="input-container">
                    <button class="attach-btn">+</button>

                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type a message..."
                    >

                    <button class="send-btn" id="sendBtn">Send</button>
                </div>
            </footer>

        </main>
    </div>

    <!-- 🔥 FIREBASE CHAT LOGIC -->
<script type="module" src="/js/chat.js"></script>

</body>
</html>
